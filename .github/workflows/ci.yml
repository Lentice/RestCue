name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
      - run: dotnet restore RestCue.sln

      # Formatting gate. Whitespace only: it needs no Roslyn analyzer pass, so
      # it adds a few seconds rather than a few minutes. Run before the build
      # so a formatting-only PR fails fast.
      - name: Verify formatting
        run: dotnet format whitespace RestCue.sln --no-restore --verify-no-changes

      - run: dotnet build RestCue.sln --configuration Release --no-restore
      - run: dotnet test RestCue.sln --configuration Release --no-build
