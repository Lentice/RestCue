name: Package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Install Inno Setup
        run: |
          $url = "https://files.jrsoftware.org/is/7/innosetup-7.0.1.exe"
          $installer = "$env:TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          & $installer /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
          Remove-Item $installer

      - name: Verify package workflow contract
        run: .\packaging\windows\test-package-workflow.ps1

      - name: Build installer and SHA-256
        run: .\packaging\windows\build-package.ps1

      - name: Verify installer lifecycle
        run: |
          $installer = Get-ChildItem artifacts\RestCue-*-win-x64.exe |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          .\packaging\windows\verify-installer.ps1 `
            -InstallerPath $installer.FullName `
            -IsccPath "${env:ProgramFiles}\Inno Setup 7\ISCC.exe"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RestCue-installer
          path: |
            artifacts/RestCue-*-win-x64.exe
            artifacts/RestCue-*-win-x64.exe.sha256
            artifacts/verification/**
